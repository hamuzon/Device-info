# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GA_MEASUREMENT_ID: G-F8HVYVW05H
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Inject Google Analytics and normalize hostnames
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          measurement_id = os.environ["GA_MEASUREMENT_ID"]
          head_pattern = re.compile(r"<head\b[^>]*>", re.IGNORECASE)

          analytics = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){{dataLayer.push(arguments);}}
          gtag("js", new Date());
          gtag("config", "{measurement_id}");
          </script>"""
          hostname_normalization = """<script>
          if (window.location.hostname.endsWith(".")) {
            const url = new URL(window.location.href);
            url.hostname = url.hostname.slice(0, -1);
            window.location.replace(url.href);
          }
          </script>"""

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts or path.name.lower().startswith("google"):
                  continue

              with path.open(encoding="utf-8", newline="") as html_file:
                  content = html_file.read()

              additions = []
              if "googletagmanager.com/gtag/js" not in content:
                  additions.append(analytics)
              if "hostname.endsWith(\".\")" not in content:
                  additions.append(hostname_normalization)
              if not additions:
                  continue

              head_match = head_pattern.search(content)
              if head_match is None:
                  raise ValueError(f"No <head> element found in {path}")

              insertion = "\n" + "\n".join(additions)
              content = (
                  content[:head_match.end()]
                  + insertion
                  + content[head_match.end():]
              )
              with path.open("w", encoding="utf-8", newline="") as html_file:
                  html_file.write(content)
          PY

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5