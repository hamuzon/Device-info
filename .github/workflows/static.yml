# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GA_MEASUREMENT_ID: G-F8HVYVW05H
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Inject Google Analytics and normalize hostnames
        run: |
          find . -type f -name "*.html" -not -name "google*.html" -not -path "./.git/*" \
            -exec sh -c '
              set -e
              for file do
                insert=$(mktemp)
                if ! grep -q "googletagmanager.com/gtag/js" "$file"; then
                  cat >> "$insert" <<EOF
          <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=$GA_MEASUREMENT_ID"></script>
          <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag("js", new Date());
          gtag("config", "$GA_MEASUREMENT_ID");
          </script>
          EOF
                fi
                if ! grep -q "hostname.endsWith" "$file"; then
                  cat >> "$insert" <<EOF
          <script>if(window.location.hostname.endsWith(".")){var url=new URL(window.location.href);url.hostname=url.hostname.slice(0,-1);window.location.replace(url.href);}</script>
          EOF
                fi
                if [ -s "$insert" ]; then
                  if ! grep -qiE "<head[^>]*>" "$file"; then
                    echo "No <head> element found in $file" >&2
                    rm -f "$insert"
                    exit 1
                  fi
                  sed -i "/<[hH][eE][aA][dD][^>]*>/r $insert" "$file"
                fi
                rm -f "$insert"
              done
            ' sh {} +

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5